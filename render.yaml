services:
  - type: web
    name: sky-accademia
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,skyacademia.tech,www.skyacademia.tech,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: sky-db
          property: connectionString

databases:
  - name: sky-db
    region: frankfurt
    plan: free
    ipAllowList: []
