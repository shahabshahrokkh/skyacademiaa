{% extends 'base/base.html' %}
{% load static %}

{% block title %}ورود به حساب کاربری{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 20px 90px; max-width: 460px;">
  <div style="background: #fff; border-radius: var(--radius-md); padding: 36px 32px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 14px; width: 50px; height: 50px; font-size: 1.4rem;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-bottom: 6px;">ورود به حساب کاربری</h1>
      <p style="font-size: 0.88rem; color: var(--text-muted);">برای دسترسی به پنل و کلاس‌ها وارد شوید</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">نام کاربری یا ایمیل</label>
        {{ form.username }}
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label">رمز عبور</label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 18px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> ورود به سیستم
      </button>
    </form>

    <div style="text-align: center; font-size: 0.88rem; color: var(--text-muted); padding-top: 18px; border-top: 1px solid var(--border-color);">
      حساب کاربری ندارید؟ 
      <a href="{% url 'accounts:register' %}" style="color: var(--primary); font-weight: 700;">ثبت‌نام کنید</a>
    </div>

  </div>
</div>
{% endblock %}
